[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-mk1"
dynamic = ["version"]
description = "A PHAL plugin for mycroft"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.5"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-mark1-utils>=0.0.1",
    "ovos-utils>=0.0.38,<1.0.0",
    "ovos-i2c-detection>=0.0.5",
    "pyserial~=3.0"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-mk1"

[project.entry-points."opm.phal"]
"ovos-phal-mk1" = "ovos_PHAL_plugin_mk1:MycroftMark1"

[tool.setuptools.dynamic]
version = {attr = "ovos_PHAL_plugin_mk1.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_PHAL_plugin_mk1*"]

[tool.setuptools.package-data]
ovos_PHAL_plugin_mk1 = ["*.json"]
